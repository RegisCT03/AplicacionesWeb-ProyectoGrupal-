<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <!-- Botón Cerrar -->
    <button class="btn-close" (click)="closeModal()">×</button>

    <div class="modal-layout">
      <!-- Imagen Decorativa Izquierda -->
      <div class="modal-imagen">
        <div class="planta-decorativa">
          <img src="assets/images/planta-decorativa.png" alt="Planta decorativa" />
        </div>
      </div>

      <!-- Contenido del Modal -->
      <div class="modal-body">
        <p class="modal-subtitle">Los horarios disponibles son los siguientes:</p>
        <h2 class="modal-fecha">{{ fecha }}</h2>

        <p class="modal-descripcion">
          Los horarios no disponibles son los que ya poseen alguna cita pendiente.
          <strong>Selecciona un horario del respectivo día</strong>
        </p>

        <!-- Grid de Horarios -->
        <div class="horarios-grid">
          <button 
            *ngFor="let horario of horarios"
            class="horario-btn"
            [class.selected]="horario === horarioActual"
            (click)="selectHorario(horario)">
            {{ horario }}
          </button>
        </div>

        <!-- Botones de Acción -->
        <div class="modal-actions">
          <button class="btn-secundario" (click)="habilitar()">Habilitar</button>
          <button class="btn-primario" (click)="deshabilitar()">Deshabilitar</button>
        </div>
      </div>
    </div>
  </div>
</div>
